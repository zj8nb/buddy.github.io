<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy Interactive Media A2</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <h1 class="site-title">ART VIDEO</h1>
      </header>

      <section class="video-stage" aria-label="Video art player">
        <div class="laptop-player" id="laptop-player">
          <!-- The video is placed inside the laptop screen -->
          <div class="laptop-screen">
            <video id="video-player" preload="metadata" playsinline>
              <source
                src="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/miac.mp4"
                type="video/mp4">
            </video>
          </div>

          <!-- These images form the laptop frame and the temporary button feedback layer -->
          <img
            class="laptop-art"
            id="laptop-art"
            src="Buddy-A2/laptop-open.png"
            alt="Hand-drawn open laptop">
          <img class="feedback-art" id="feedback-art" alt="">

          <!-- Transparent buttons are positioned over the matching keys in the illustration -->
          <div class="laptop-controls" aria-label="Laptop media controls">
            <button class="laptop-key key-rewind" type="button" data-action="rewind" aria-label="Rewind 10 seconds"></button>
            <button class="laptop-key key-play-pause" type="button" data-action="play-pause" aria-label="Play or pause"></button>
            <button class="laptop-key key-forward" type="button" data-action="forward" aria-label="Forward 10 seconds"></button>
            <button class="laptop-key key-mute" type="button" data-action="mute" aria-label="Mute or unmute"></button>
            <button class="laptop-key key-volume-down" type="button" data-action="volume-down" aria-label="Decrease volume"></button>
            <button class="laptop-key key-volume-up" type="button" data-action="volume-up" aria-label="Increase volume"></button>
            <button class="laptop-key key-spacebar" type="button" data-action="play-pause" data-feedback="spacebar" aria-label="Spacebar: play or pause"></button>
          </div>

        </div>

        <!-- Mobile users swipe the laptop; desktop users click the OPEN or CLOSE control. -->
        <p class="swipe-hint" id="swipe-hint">Swipe down to close</p>
        <button class="laptop-toggle" id="laptop-toggle" type="button">CLOSE</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
